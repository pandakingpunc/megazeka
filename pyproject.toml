[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "megazeka"
version = "0.1.0"
description = "Yerel Türkçe yazım düzeltme ve makine öğrenmesi laboratuvarı"
requires-python = ">=3.11,<3.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
